<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ALAMIN.SH \u2014 Web Developer & Graphics Designer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:          #080b08;
    --panel:       #0d110d;
    --border:      #162016;
    --green:       #00ff41;
    --green-dim:   #00b32c;
    --green-glow:  rgba(0,255,65,0.18);
    --green-faint: rgba(0,255,65,0.05);
    --amber:       #ffb000;
    --red:         #ff2222;
    --cyan:        #00e5ff;
    --white:       #c8ffc8;
    --muted:       #1e341e;
    --muted2:      #3a5e3a;
    /* Safe fallback font stack \u2014 works offline */
    --font-mono: 'Share Tech Mono', 'Courier New', Courier, monospace;
    --font-vt:   'VT323', 'Courier New', Courier, monospace;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font-mono);
    background: var(--bg);
    color: var(--green);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* \u2500\u2500 CRT SCANLINES \u2500\u2500 */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 9999;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,0.09) 2px, rgba(0,0,0,0.09) 3px
    );
  }

  /* \u2500\u2500 VIGNETTE \u2500\u2500 */
  body::after {
    content: '';
    position: fixed; inset: 0; z-index: 9998;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.72) 100%);
  }

  /* \u2500\u2500 STATUS BAR \u2500\u2500 */
  .statusbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 200;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 0 14px;
    height: 34px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 10px; color: var(--muted2);
    letter-spacing: 0.1em;
    overflow: hidden;
  }
  .sb-left, .sb-right { display: flex; align-items: center; gap: 14px; white-space: nowrap; }
  .sb-green { color: var(--green); }
  .sb-amber { color: var(--amber); }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    display: inline-block; margin-right: 4px; vertical-align: middle;
  }
  .dot-g { background: var(--green); box-shadow: 0 0 5px var(--green); animation: dp 2s infinite; }
  .dot-a { background: var(--amber); box-shadow: 0 0 5px var(--amber); }
  @keyframes dp { 0%,100%{opacity:1}50%{opacity:0.35} }
  .blink { animation: bl 1s step-end infinite; }
  @keyframes bl { 0%,100%{opacity:1}50%{opacity:0} }

  /* \u2500\u2500 MAIN \u2500\u2500 */
  .page { max-width: 700px; margin: 0 auto; padding: 50px 14px 70px; }

  /* \u2500\u2500 TERMINAL WINDOW \u2500\u2500 */
  .term-window {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 3px;
    margin-bottom: 18px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0,0,0,0.7), 0 0 0 1px rgba(0,255,65,0.03);
    /* NO opacity:0 \u2014 always visible */
  }

  .term-bar {
    background: #080b08;
    border-bottom: 1px solid var(--border);
    padding: 7px 12px;
    display: flex; align-items: center; gap: 8px;
    font-size: 10px; color: var(--muted2); letter-spacing: 0.08em;
  }
  .tdots { display: flex; gap: 5px; }
  .td { width: 10px; height: 10px; border-radius: 50%; }
  .td-r { background: #ff5f56; } .td-y { background: #ffbd2e; } .td-g { background: #27c93f; }
  .tbar-title { flex: 1; text-align: center; }

  .term-body { padding: 18px 18px; }

  /* \u2500\u2500 PROMPT \u2500\u2500 */
  .prompt-line {
    display: flex; align-items: baseline; flex-wrap: wrap;
    margin-bottom: 4px; font-size: 13px; gap: 0;
  }
  .pu { color: var(--green); font-weight: 700; }
  .pa { color: var(--muted2); }
  .ph { color: var(--cyan); }
  .pp { color: var(--muted2); }
  .ps { color: var(--green-dim); margin: 0 7px 0 3px; }
  .pc { color: var(--white); }
  .pf { color: var(--amber); }

  /* \u2500\u2500 OUTPUT \u2500\u2500 */
  .out { font-size: 13px; line-height: 1.72; margin-bottom: 1px; }
  .o-dim   { color: var(--muted2); }
  .o-green { color: var(--green); }
  .o-amber { color: var(--amber); }
  .o-cyan  { color: var(--cyan); }
  .o-white { color: var(--white); }
  .o-red   { color: var(--red); }
  .gap    { height: 10px; }
  .gap-sm { height: 5px; }

  /* \u2500\u2500 ASCII BANNER \u2500\u2500 */
  .ascii {
    font-size: 11px; line-height: 1.15;
    color: var(--green-dim);
    margin-bottom: 16px;
    white-space: pre;
    overflow-x: auto;
    text-shadow: 0 0 10px rgba(0,255,65,0.3);
    font-family: var(--font-mono);
  }

  /* \u2500\u2500 AVATAR BLOCK \u2500\u2500 */
  .avatar-block { display: flex; align-items: flex-start; gap: 20px; margin: 14px 0; flex-wrap: wrap; }
  .avatar-wrap  { position: relative; flex-shrink: 0; width: 100px; height: 100px; }
  .avatar-frame {
    width: 100px; height: 100px;
    border: 1px solid var(--green-dim);
    position: relative; overflow: hidden;
    animation: fglow 3s ease-in-out infinite;
  }
  @keyframes fglow {
    0%,100%{ box-shadow: 0 0 8px var(--green-glow); border-color: var(--green-dim); }
    50%    { box-shadow: 0 0 22px var(--green-glow); border-color: var(--green); }
  }
  .avatar-img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    filter: sepia(0.15) hue-rotate(90deg) saturate(0.5) brightness(0.85);
  }
  .av-scan {
    position: absolute; left: 0; right: 0; top: 0; height: 3px;
    background: linear-gradient(transparent, rgba(0,255,65,0.5), transparent);
    animation: scan 2.5s linear infinite; pointer-events: none;
  }
  @keyframes scan { 0%{top:0;opacity:.9} 90%{top:97px;opacity:.9} 100%{top:97px;opacity:0} }
  /* corners */
  .c { position: absolute; width: 9px; height: 9px; border-color: var(--green); border-style: solid; z-index: 2; }
  .c-tl { top:-1px; left:-1px; border-width: 2px 0 0 2px; }
  .c-tr { top:-1px; right:-1px; border-width: 2px 2px 0 0; }
  .c-bl { bottom:-1px; left:-1px; border-width: 0 0 2px 2px; }
  .c-br { bottom:-1px; right:-1px; border-width: 0 2px 2px 0; }
  .av-status {
    position: absolute; bottom: 4px; left: 4px; font-size: 9px;
    color: var(--green); background: rgba(0,0,0,0.75); padding: 1px 4px;
    border: 1px solid var(--green-dim); z-index: 3; letter-spacing: .04em;
  }

  .avatar-info { flex: 1; min-width: 160px; }
  .hero-name {
    font-family: var(--font-vt);
    font-size: 40px; line-height: 0.95;
    color: var(--green);
    text-shadow: 0 0 20px rgba(0,255,65,0.55);
    margin-bottom: 5px;
  }
  .hero-role { font-size: 10px; color: var(--amber); letter-spacing: .14em; text-transform: uppercase; margin-bottom: 11px; }
  .badges { display: flex; flex-wrap: wrap; gap: 5px; }
  .badge { font-size: 10px; padding: 2px 9px; border: 1px solid var(--muted); color: var(--muted2); letter-spacing: .06em; border-radius: 1px; }
  .b-green { border-color: var(--green-dim); color: var(--green); box-shadow: 0 0 5px rgba(0,255,65,.1); }
  .b-amber { border-color: #6e4e00; color: var(--amber); }

  /* \u2500\u2500 STAT GRID \u2500\u2500 */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
  .stat-box {
    border: 1px solid var(--border); padding: 13px 15px;
    background: var(--bg); position: relative; overflow: hidden;
  }
  .stat-box::after {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--green-dim), transparent); opacity: .4;
  }
  .stat-num {
    font-family: var(--font-vt); font-size: 48px; line-height: 1;
    color: var(--green); text-shadow: 0 0 18px rgba(0,255,65,.5); margin-bottom: 3px;
  }
  .stat-lbl { font-size: 10px; color: var(--muted2); letter-spacing: .1em; text-transform: uppercase; }

  /* \u2500\u2500 SKILL BARS \u2500\u2500 */
  .skill-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
  .skill-name { width: 140px; font-size: 12px; color: var(--white); flex-shrink: 0; }
  .skill-track { flex: 1; height: 13px; background: var(--bg); border: 1px solid var(--border); position: relative; overflow: hidden; }
  .skill-fill {
    height: 100%;
    background: repeating-linear-gradient(90deg, var(--green) 0, var(--green) 5px, transparent 5px, transparent 8px);
    box-shadow: 0 0 8px rgba(0,255,65,.3);
    width: 0; transition: width 1.6s cubic-bezier(.22,1,.36,1);
  }
  .skill-pct { width: 32px; font-size: 11px; color: var(--green-dim); text-align: right; flex-shrink: 0; }

  /* \u2500\u2500 HIGHLIGHT LIST \u2500\u2500 */
  .hl-row { display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); padding: 12px 0; }
  .hl-row:last-child { border-bottom: none; }
  .hl-idx  { font-size: 10px; color: var(--muted2); width: 20px; flex-shrink: 0; }
  .hl-icon { font-size: 16px; width: 24px; flex-shrink: 0; }
  .hl-name { font-size: 13px; color: var(--white); margin-bottom: 2px; }
  .hl-sub  { font-size: 10px; color: var(--muted2); letter-spacing: .05em; }
  .hl-tag  { margin-left: auto; font-size: 10px; padding: 2px 7px; flex-shrink: 0; border: 1px solid var(--green-dim); color: var(--green); letter-spacing: .05em; }
  .hl-tag-a { border-color: #6e4e00 !important; color: var(--amber) !important; }

  /* \u2500\u2500 CMD INPUT \u2500\u2500 */
  .cmd-line { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); padding: 9px 13px; margin-top: 14px; background: var(--bg); }
  .cmd-sym   { color: var(--green); font-size: 13px; }
  .cmd-input { flex: 1; background: none; border: none; outline: none; font-family: var(--font-mono); font-size: 13px; color: var(--white); caret-color: var(--green); }
  .cmd-cur   { width: 8px; height: 14px; background: var(--green); box-shadow: 0 0 7px var(--green); animation: bl 1s step-end infinite; }

  /* \u2500\u2500 BUTTONS \u2500\u2500 */
  .btn-connect {
    background: var(--green); color: #000; border: none;
    font-family: var(--font-mono); font-size: 12px; font-weight: 700;
    padding: 11px 20px; cursor: pointer; letter-spacing: .1em; text-transform: uppercase;
    box-shadow: 0 0 18px rgba(0,255,65,.3); transition: box-shadow .15s;
  }
  .btn-connect:hover { box-shadow: 0 0 30px rgba(0,255,65,.55); }
  .btn-resume {
    background: none; color: var(--muted2); border: 1px solid var(--border);
    font-family: var(--font-mono); font-size: 12px;
    padding: 11px 20px; cursor: pointer; letter-spacing: .1em; text-transform: uppercase;
    text-decoration: none; display: inline-flex; align-items: center; transition: all .15s;
  }
  .btn-resume:hover { border-color: var(--green-dim); color: var(--green); }

  /* \u2500\u2500 GLITCH \u2500\u2500 */
  .glitch { position: relative; display: inline-block; }
  .glitch::before, .glitch::after {
    content: attr(data-text); position: absolute; top: 0; left: 0;
    font-family: var(--font-vt); font-size: inherit; line-height: inherit; color: var(--green);
  }
  .glitch::before { color: var(--cyan); clip-path: polygon(0 0,100% 0,100% 40%,0 40%); animation: g1 4s steps(1) infinite; }
  .glitch::after  { color: var(--red);  clip-path: polygon(0 60%,100% 60%,100% 100%,0 100%); animation: g2 4s steps(1) infinite; }
  @keyframes g1 { 0%,94%{opacity:0;transform:translateX(0)} 95%{opacity:.7;transform:translateX(-3px)} 96%{transform:translateX(2px)} 97%,100%{opacity:0;transform:translateX(0)} }
  @keyframes g2 { 0%,94%{opacity:0;transform:translateX(0)} 95%{opacity:.7;transform:translateX(3px)}  96%{transform:translateX(-2px)} 97%,100%{opacity:0;transform:translateX(0)} }

  /* \u2500\u2500 POPUP \u2500\u2500 */
  .popup-overlay { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,.9); align-items: center; justify-content: center; }
  .popup-box {
    background: var(--panel); border: 1px solid var(--green-dim);
    box-shadow: 0 0 60px rgba(0,255,65,.13); max-width: 370px; width: 94%;
    animation: pi .22s ease both;
  }
  @keyframes pi { from{opacity:0;transform:scale(.95) translateY(5px)} to{opacity:1;transform:scale(1) translateY(0)} }
  .popup-bar {
    background: #080b08; border-bottom: 1px solid var(--border);
    padding: 7px 12px; display: flex; align-items: center; gap: 8px;
    font-size: 10px; color: var(--muted2); letter-spacing: .08em;
  }
  .popup-close-btn {
    margin-left: auto; background: none; border: 1px solid var(--border);
    color: var(--muted2); cursor: pointer; font-family: var(--font-mono);
    font-size: 10px; padding: 2px 8px; letter-spacing: .1em; transition: all .15s;
  }
  .popup-close-btn:hover { border-color: var(--red); color: var(--red); }
  .popup-body { padding: 20px 20px 18px; }
  .popup-prompt { font-size: 12px; color: var(--muted2); margin-bottom: 16px; line-height: 1.7; }

  .popup-opt {
    width: 100%; border: 1px solid var(--border); padding: 12px 15px;
    background: var(--bg); cursor: pointer; font-family: var(--font-mono); font-size: 13px;
    display: flex; align-items: center; gap: 11px;
    margin-bottom: 8px; text-align: left; transition: all .15s; color: var(--white);
  }
  .popup-opt:last-child { margin-bottom: 0; }
  .popup-opt:hover { border-color: var(--green-dim); color: var(--green); background: var(--green-faint); }
  .popup-opt-key   { color: var(--green); font-weight: 700; width: 18px; flex-shrink: 0; }
  .popup-opt-info  { flex: 1; }
  .popup-opt-title { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
  .popup-opt-sub   { font-size: 10px; color: var(--muted2); }
  .popup-opt-arrow { color: var(--muted2); transition: color .15s; }
  .popup-opt:hover .popup-opt-arrow { color: var(--green); }
  .popup-opt.business { border-color: #1a3a1a; }
  .popup-opt.business .popup-opt-key { color: #27c93f; }

  .sorry-screen { display: none; animation: pi .2s ease both; }
  .sorry-code { font-family: var(--font-vt); font-size: 26px; color: var(--red); text-shadow: 0 0 12px rgba(255,34,34,.5); margin-bottom: 10px; letter-spacing: .1em; }
  .sorry-msg  { font-size: 12px; color: var(--muted2); line-height: 1.85; margin-bottom: 18px; }
  .sorry-msg .hi { color: var(--amber); }
  .back-btn {
    background: none; border: 1px solid var(--border); color: var(--muted2);
    font-family: var(--font-mono); font-size: 12px; padding: 8px 18px; cursor: pointer;
    letter-spacing: .1em; transition: all .15s;
  }
  .back-btn:hover { border-color: var(--green-dim); color: var(--green); }

  /* \u2500\u2500 SCROLL TOP \u2500\u2500 */
  .scroll-top {
    position: fixed; bottom: 18px; right: 14px; z-index: 200;
    background: var(--panel); border: 1px solid var(--border);
    color: var(--muted2); font-family: var(--font-mono); font-size: 11px;
    padding: 7px 12px; cursor: pointer; letter-spacing: .08em; transition: all .15s;
  }
  .scroll-top:hover { border-color: var(--green-dim); color: var(--green); }

  /* \u2500\u2500 SCROLLBAR \u2500\u2500 */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); }
  ::-webkit-scrollbar-thumb:hover { background: var(--green-dim); }

  @media (max-width: 480px) {
    .ascii { font-size: 8px; }
    .hero-name { font-size: 32px; }
    .stat-num  { font-size: 38px; }
    .skill-name { width: 108px; }
    .term-body { padding: 14px 12px; }
    .sb-right .sb-amber { display: none; }
  }
</style>
</head>
<body>

<!-- STATUS BAR -->
<div class="statusbar">
  <div class="sb-left">
    <span><span class="dot dot-g"></span><span class="sb-green">CONNECTED</span></span>
    <span class="sb-amber">SESSION://ALAMIN.DEV</span>
    <span>TTY0</span>
  </div>
  <div class="sb-right">
    <span id="clock" class="sb-green">00:00:00</span>
    <span class="sb-amber"><span class="dot dot-a"></span>UPTIME: <span class="sb-green">4+</span></span>
  </div>
</div>

<div class="page">

  <!-- \u2550\u2550 HERO WINDOW \u2550\u2550 -->
